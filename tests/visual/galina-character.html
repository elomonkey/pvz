<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><title>Галина · prototype</title>
  <style>
    body {
      margin: 0;
      background: #eee9df;
      color: #352d2d;
      font:
        16px 'Segoe UI',
        sans-serif;
    }
    header {
      padding: 24px 38px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 28px;
    }
    p {
      margin: 6px 0;
      color: #817466;
      font-size: 14px;
    }
    button {
      padding: 8px 12px;
      margin: 3px;
      border: 1px solid #d1bdaa;
      background: #fff2dd;
      color: #573b3d;
      border-radius: 5px;
      cursor: pointer;
    }
    canvas {
      display: block;
      width: 100%;
      height: 600px;
    }
    .labels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      text-align: center;
      font-size: 21px;
      font-weight: 700;
    }
    .stats {
      font-size: 13px;
      color: #887567;
      font-weight: 400;
      margin-top: 5px;
    }
    footer {
      padding: 22px 38px;
      font-size: 14px;
      color: #817466;
    }
  </style>
  <header>
    <div>
      <h1>Галина · от концепта к игровой модели</h1>
      <p>Одинаковые камера, масштаб и освещение · настоящий Three.js</p>
    </div>
    <nav>
      <div>
        <button data-pose="idle">Idle</button
        ><button data-pose="walking">Ходьба</button
        ><button data-pose="impatient">Недовольство</button
        ><button data-pose="angry">Злость</button
        ><button data-pose="carry">Посылка</button>
      </div>
      <div>
        <button data-angle="0">Спереди</button
        ><button data-angle="0.4">3/4</button
        ><button data-angle="3.14">Сзади</button>
      </div>
    </nav>
  </header>
  <canvas></canvas>
  <section class="labels"></section>
  <footer>
    Слева — прежняя модель. Справа — новый прототип Галины. Без shadow maps и
    постобработки.
  </footer>
  <script type="module">
    import * as THREE from 'three';
    import { BOSS_ARCHETYPE } from '/src/data.ts';
    import { createPerson } from '/src/view/characters.ts';
    import { createGalinaPerson } from '/src/view/galinaCharacter.ts';
    const canvas = document.querySelector('canvas'),
      r = new THREE.WebGLRenderer({ canvas, antialias: true });
    r.setSize(canvas.clientWidth, 600, false);
    r.setPixelRatio(1);
    r.setClearColor('#eee9df');
    r.toneMapping = THREE.ACESFilmicToneMapping;
    const scene = new THREE.Scene();
    scene.add(
      new THREE.AmbientLight(0xfff8ed, 0.25),
      new THREE.HemisphereLight(0xe5eff2, 0xc7ae91, 0.8),
    );
    const key = new THREE.DirectionalLight(0xffedda, 2.2);
    key.position.set(-3, 8, 4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xddeaf4, 0.3);
    fill.position.set(7, 6, -5);
    scene.add(fill);
    const half = (3.2 * 600) / canvas.clientWidth;
    const camera = new THREE.OrthographicCamera(
      -3.2,
      3.2,
      half,
      -half,
      0.1,
      40,
    );
    camera.position.set(0, 3.7, 10);
    camera.lookAt(0, 1, 0);
    const rigs = [
      createPerson({ ...BOSS_ARCHETYPE, boss: true }),
      createGalinaPerson({ ...BOSS_ARCHETYPE, boss: true }),
    ];
    rigs.forEach((rig, i) => {
      rig.root.position.x = i ? 1.45 : -1.45;
      rig.root.rotation.y = 0.4;
      scene.add(rig.root);
    });
    let pose = 'idle';
    function stats() {
      return rigs.map((rig) => {
        let total = 0,
          visible = 0;
        rig.root.traverse((o) => {
          if (o.isMesh)
            total +=
              (o.geometry.index?.count ??
                o.geometry.attributes.position.count) / 3;
        });
        rig.root.traverseVisible((o) => {
          if (o.isMesh)
            visible +=
              (o.geometry.index?.count ??
                o.geometry.attributes.position.count) / 3;
        });
        return { total, visible };
      });
    }
    function render(next = pose, time = 0.5, dt = 0) {
      pose = next;
      for (const rig of rigs) {
        rig.setCarry(pose === 'carry', '#c8a072');
        rig.update(
          dt,
          pose === 'walking',
          time,
          pose === 'impatient' || pose === 'angry' ? pose : 'idle',
        );
      }
      r.render(scene, camera);
      const values = stats();
      document.querySelector('.labels').innerHTML = values
        .map(
          (s, i) =>
            `<div>${i ? 'Новый прототип' : 'Прежняя модель'}<div class="stats">${s.visible} видимых / ${s.total} всего треугольников</div></div>`,
        )
        .join('');
    }
    document
      .querySelectorAll('[data-pose]')
      .forEach((b) => (b.onclick = () => render(b.dataset.pose, 1.5, 0.2)));
    document.querySelectorAll('[data-angle]').forEach(
      (b) =>
        (b.onclick = () => {
          rigs.forEach(
            (rig) => (rig.root.rotation.y = Number(b.dataset.angle)),
          );
          render();
        }),
    );
    window.galinaLab = { rigs, renderer: r, scene, camera, render, stats };
    render();
    document.body.dataset.ready = '1';
  </script>
</html>
