<!doctype html>
<html lang="ru">
  <meta charset="utf-8" /><title>Персонажи · visual pass</title>
  <style>
    body {
      margin: 0;
      background: #e9eeea;
      color: #33434a;
      font:
        16px 'Segoe UI',
        sans-serif;
    }
    header {
      padding: 28px 40px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 6px;
    }
    p {
      margin: 0;
      color: #738077;
      font-size: 14px;
    }
    button {
      padding: 9px 15px;
      margin-left: 6px;
      border: 1px solid #c9d4cb;
      border-radius: 8px;
      background: #f7f4ea;
      color: #47594e;
      cursor: pointer;
    }
    canvas {
      display: block;
      width: 100%;
      height: 550px;
    }
    .names {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      padding: 0 3%;
      font-size: 16px;
    }
    .stats {
      font-size: 12px;
      color: #77887b;
      padding-top: 6px;
    }
    footer {
      padding: 24px 40px;
      font-size: 13px;
      color: #738077;
    }
  </style>
  <header>
    <div>
      <h1>Характер в силуэте</h1>
      <p>Шесть клиентов + сотрудник · единый low-poly rig</p>
    </div>
    <nav>
      <button data-pose="idle">Idle</button><button data-pose="walking">Ходьба</button
      ><button data-pose="impatient">Недовольство</button><button data-pose="angry">Злость</button
      ><button data-pose="carry">Посылка</button>
    </nav>
  </header>
  <canvas></canvas>
  <div class="names"></div>
  <footer>Одинаковые свет, камера и масштаб. Без shadow maps и постобработки.</footer>
  <script type="module">
    import * as THREE from 'three';
    import { ARCHETYPES } from '/src/data.ts';
    import { createStyledPerson, CHARACTER_STYLES } from '/src/view/characterRig.ts';
    const canvas = document.querySelector('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(1);
    renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    const scene = new THREE.Scene();
    scene.add(new THREE.AmbientLight(0xfff8ed, 0.25), new THREE.HemisphereLight(0xe5eff2, 0xc7ae91, 0.8));
    const key = new THREE.DirectionalLight(0xffedda, 2.2);
    key.position.set(-3, 8, 4);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xddeaf4, 0.3);
    fill.position.set(7, 6, -5);
    scene.add(fill);
    const halfHeight = (4.35 * canvas.clientHeight) / canvas.clientWidth;
    const camera = new THREE.OrthographicCamera(-4.35, 4.35, halfHeight, -halfHeight, 0.1, 40);
    camera.position.set(0, 4.3, 10);
    camera.lookAt(0, 0.86, 0);
    const player = {
      coat: '#2d5f9a',
      pants: '#263238',
      skin: '#e8b98f',
      hair: '#3b2a20',
      accent: '#f2b134',
      cap: true,
      scale: 1.02,
      accessory: 'lanyard',
    };
    const labels = ['Студент', 'Мама', 'Курьер', 'Пенсионерка', 'Блогер', 'Офисный', 'Сотрудник'];
    const previews = CHARACTER_STYLES.map((id, i) => {
      const options = id === 'player' ? player : ARCHETYPES.find((a) => a.id === id);
      const rig = createStyledPerson(options, id);
      rig.root.position.x = (i - 3) * 1.18;
      rig.root.rotation.y = 0.32;
      scene.add(rig.root);
      return { id, options, rig };
    });
    function render(pose = 'idle', time = 0.5, dt = 0) {
      for (const p of previews) {
        p.rig.setCarry(pose === 'carry');
        p.rig.update(dt, pose === 'walking', time, pose === 'impatient' || pose === 'angry' ? pose : 'idle');
      }
      renderer.render(scene, camera);
    }
    function stats() {
      document.querySelector('.names').innerHTML = previews
        .map((p, i) => {
          let triangles = 0;
          p.rig.root.traverse((o) => {
            if (o.isMesh) triangles += (o.geometry.index?.count ?? o.geometry.attributes.position.count) / 3;
          });
          return `<div>${labels[i]}<div class="stats">${triangles} треугольников</div></div>`;
        })
        .join('');
    }
    window.lineup = { previews, renderer, scene, camera, render, stats };
    document.querySelectorAll('button').forEach((b) => (b.onclick = () => render(b.dataset.pose)));
    render();
    stats();
    document.body.dataset.ready = '1';
  </script>
</html>
